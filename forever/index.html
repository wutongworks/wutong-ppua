<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>✦</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#01030c; overflow:hidden; font-family:"Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased; touch-action:none; cursor:crosshair}
  #space{position:fixed; inset:0; display:block}
  .vignette{position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse 110% 95% at 50% 46%, transparent 55%, rgba(0,0,5,.55) 100%)}
  .ui{position:fixed; z-index:5; left:50%; bottom:26px; transform:translateX(-50%);
    color:rgba(224,242,254,.8); font-size:11px; letter-spacing:.34em; text-indent:.34em;
    padding:13px 26px; border-radius:999px; border:1px solid rgba(147,197,253,.22);
    background:rgba(2,8,23,.34); backdrop-filter:blur(10px); cursor:pointer; transition:opacity 1.2s, color .3s, border-color .3s; font-family:inherit}
  .ui:hover{color:#fff; border-color:rgba(186,230,253,.6)}
  .ui b{color:#7dd3fc; font-weight:800}
  .ui.gone{opacity:0; pointer-events:none}
  .hint{position:fixed; z-index:5; left:50%; bottom:76px; transform:translateX(-50%);
    color:rgba(186,220,253,.45); font-size:10px; letter-spacing:.4em; text-indent:.4em; white-space:nowrap;
    pointer-events:none; transition:opacity 1.6s; opacity:0}
  #gate{position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:rgba(1,3,12,.66); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); transition:opacity 1.1s}
  #gate.gone{opacity:0; pointer-events:none}
  #gate .star{color:#7dd3fc; font-size:22px; animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  #gate .q{color:rgba(224,242,254,.85); font-size:14px; letter-spacing:.5em; text-indent:.5em}
  #gateRow{display:flex; gap:10px; align-items:center}
  #pw{width:210px; padding:13px 20px; border-radius:999px; border:1px solid rgba(147,197,253,.3);
    background:rgba(2,8,23,.5); color:#e0f2fe; font-size:15px; letter-spacing:.14em; text-align:center; outline:none; font-family:inherit}
  #pw:focus{border-color:rgba(186,230,253,.7)}
  #go{padding:13px 24px; border-radius:999px; border:1px solid rgba(147,197,253,.3); background:rgba(2,8,23,.5);
    color:rgba(224,242,254,.85); font-size:12px; letter-spacing:.3em; text-indent:.3em; cursor:pointer; font-family:inherit; transition:.3s}
  #go:hover{color:#fff; border-color:rgba(186,230,253,.7)}
  #gate .err{color:rgba(253,186,186,0); font-size:11px; letter-spacing:.3em; text-indent:.3em; transition:color .3s; height:14px}
  #gate .err.show{color:rgba(253,186,186,.85)}
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
  @media (max-width:640px){ .ui{bottom:20px} .hint{bottom:68px} }
</style>
</head>
<body>
  <canvas id="space"></canvas>
  <div class="vignette"></div>
  <div id="gate">
    <div class="star">✦</div>
    <div class="q">只属于两个人</div>
    <div id="gateRow">
      <input id="pw" type="password" placeholder="输入口令" autocomplete="off">
      <button id="go">进入</button>
    </div>
    <div class="err" id="err">口令不对，再想想</div>
  </div>
  <div class="hint" id="hint">TAP TO LET IT DRIFT AWAY</div>
  <button class="ui" id="enterBtn">ENTER <b>✦</b></button>

<script>
  // ---------- the gate ----------
  (function gate() {
    const g = document.getElementById('gate');
    if (sessionStorage.getItem('forever-ok') === '1') { g.classList.add('gone'); return; }
    const pw = document.getElementById('pw'), err = document.getElementById('err');
    function tryOpen() {
      if (pw.value === '老公我爱你') {
        sessionStorage.setItem('forever-ok', '1');
        err.classList.remove('show');
        g.classList.add('gone');
      } else {
        err.classList.add('show');
        g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
        pw.select();
      }
    }
    document.getElementById('go').addEventListener('click', tryOpen);
    pw.addEventListener('keydown', e => { if (e.key === 'Enter') tryOpen(); });
    setTimeout(() => { try { pw.focus(); } catch (e) {} }, 350);
  })();

  const cv = document.getElementById('space'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1;
  let t = 0;
  let mode = 'flow';                 // flow | tracing | lit | fading
  let traceStart = 0, fadeStart = 0, litAlpha = 0;
  let surge = 0, surgeOn = false;
  const ptr = { x: -9999, y: -9999, vx: 0, vy: 0, down: false, downT: 0, lastX: 0, lastY: 0, moved: 0 };

  const grain = document.createElement('canvas'); grain.width = grain.height = 140;
  (function paintGrain() {
    const c = grain.getContext('2d'), img = c.createImageData(140, 140);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255 | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    c.putImageData(img, 0, 0);
  })();

  function fieldAngle(x, y) {
    return (Math.sin(x * 0.0021 + t * 0.12) + Math.cos(y * 0.0018 - t * 0.09) + Math.sin((x + y) * 0.00105 + t * 0.06)) * 1.12 + 0.35;
  }
  function baseHue() { return 192 + 78 * (0.5 + 0.5 * Math.sin(t * 0.011)); }

  // ---------- the words, rendered once as a glowing layer ----------
  let textLayer = null, lines = [];   // lines: {top, bottom, pts sorted by x}
  function buildText() {
    const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
    const m = mask.getContext('2d');
    m.fillStyle = '#fff'; m.textAlign = 'center'; m.textBaseline = 'middle';
    const cxp = W / 2, narrow = W < 560;
    const linesArr = narrow ? ['love you', 'forever'] : ['love you forever'];
    let ms = Math.min(W * (narrow ? 0.235 : 0.155), 168);
    const setMain = s => { m.font = `italic 700 ${s}px Georgia, "Times New Roman", "Songti SC", serif`; };
    setMain(ms);
    const longest = linesArr.reduce((a, b) => m.measureText(a).width > m.measureText(b).width ? a : b);
    while (m.measureText(longest).width > W * 0.9 && ms > 20) { ms -= 3; setMain(ms); }
    const lineH = ms * 1.18;
    const y0 = H * 0.40 - (linesArr.length - 1) * lineH / 2;
    const bands = [];
    linesArr.forEach((ln, i) => {
      const y = y0 + i * lineH;
      m.fillText(ln, cxp, y);
      bands.push({ top: y - ms * 0.62, bottom: y + ms * 0.62, kind: 'main' });
    });
    const nameY = y0 + (linesArr.length - 1) * lineH + ms * 1.12;
    let ns = Math.min(W * 0.145, 90);
    const setName = s => { m.font = `700 ${s}px "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", serif`; };
    try { m.letterSpacing = '20px'; } catch (e) {}
    setName(ns);
    while (m.measureText('席琼桦').width > W * 0.68 && ns > 20) { ns -= 3; setName(ns); }
    m.fillText('席琼桦', cxp, nameY);
    bands.push({ top: nameY - ns * 0.66, bottom: nameY + ns * 0.66, kind: 'name' });

    // glowing render of the same layout
    textLayer = document.createElement('canvas');
    textLayer.width = W * DPR; textLayer.height = H * DPR;
    const c = textLayer.getContext('2d'); c.scale(DPR, DPR);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const drawAll = (pass) => {
      linesArr.forEach((ln, i) => { setMainOn(c, ms); c.fillText(ln, cxp, y0 + i * lineH); });
      setNameOn(c, ns); c.fillText('席琼桦', cxp, nameY);
    };
    function setMainOn(cc, s) { cc.font = `italic 700 ${s}px Georgia, "Times New Roman", "Songti SC", serif`; }
    function setNameOn(cc, s) { cc.font = `700 ${s}px "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", serif`; try { cc.letterSpacing = '20px'; } catch (e) {} }
    const hue = baseHue();
    c.shadowColor = `hsla(${hue + 20}, 95%, 68%, .95)`;
    for (const [blur, style] of [[26, `hsla(${hue + 24}, 92%, 62%, .55)`], [13, `hsla(${hue + 12}, 95%, 74%, .8)`], [4, 'rgba(240,249,255,.96)']]) {
      c.shadowBlur = blur; c.fillStyle = style; drawAll();
    }
    c.shadowBlur = 0;

    // ink points per band, sorted by x — the meteor paths
    const img = m.getImageData(0, 0, W, H).data;
    lines = bands.map(b => ({ ...b, pts: [] }));
    for (let y = 0; y < H; y += 3)
      for (let x = 0; x < W; x += 3)
        if (img[(y * W + x) * 4 + 3] > 110) {
          const L = lines.find(L => y >= L.top && y <= L.bottom);
          if (L) L.pts.push({ x, y });
        }
    for (const L of lines) L.pts.sort((a, b) => a.x - b.x);
  }

  // ---------- ambient river ----------
  let parts = [];
  function spawn(p) {
    p.x = Math.random() * W; p.y = Math.random() * H;
    p.px = p.x; p.py = p.y;
    p.life = 0; p.maxLife = 300 + Math.random() * 460;
    p.speed = 0.55 + Math.random() * 0.95;
    p.hueJit = (Math.random() - 0.5) * 46;
    p.w = Math.random() * 1.5 + 0.5;
    return p;
  }
  function buildParts() {
    parts = [];
    const n = Math.min(1500, Math.floor(W * H / 1250));
    for (let i = 0; i < n; i++) { const p = spawn({}); p.life = Math.random() * p.maxLife; parts.push(p); }
  }
  let sparks = [];
  function spawnSparks(x, y, power, hue) {
    const n = Math.floor(50 * power);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (Math.random() * 5 + 1) * power;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.012 + Math.random() * 0.02, hue: hue + (Math.random() - 0.5) * 40 });
    }
  }

  // ---------- meteor heads that trace the strokes ----------
  let heads = [];
  function addHead(lineIdx, speed) {
    const L = lines[lineIdx];
    if (!L || !L.pts.length) return;
    heads.push({ line: lineIdx, p: 0, speed, x: L.pts[0].x, y: L.pts[0].y, trail: [], sweep: true });
  }
  let nextSweep = 0;

  // ---------- interaction ----------
  addEventListener('pointermove', e => {
    ptr.vx = ptr.vx * 0.55 + (e.clientX - ptr.lastX) * 0.45;
    ptr.vy = ptr.vy * 0.55 + (e.clientY - ptr.lastY) * 0.45;
    if (ptr.down) ptr.moved += Math.abs(e.clientX - ptr.lastX) + Math.abs(e.clientY - ptr.lastY);
    ptr.lastX = e.clientX; ptr.lastY = e.clientY;
    ptr.x = e.clientX; ptr.y = e.clientY;
  }, { passive: true });
  addEventListener('pointerdown', e => {
    if (e.target.closest('.ui')) return;
    ptr.down = true; ptr.downT = performance.now(); ptr.moved = 0;
    ptr.lastX = ptr.x = e.clientX; ptr.lastY = ptr.y = e.clientY;
  });
  addEventListener('pointerup', e => {
    if (!ptr.down) return;
    ptr.down = false;
    if (e.target.closest('.ui')) return;
    const quick = performance.now() - ptr.downT < 260 && ptr.moved < 12;
    if (!quick) return;
    if (mode === 'lit' || mode === 'tracing') {
      mode = 'fading'; fadeStart = t;
      document.getElementById('enterBtn').classList.remove('gone');
      document.getElementById('hint').style.opacity = '0';
    } else if (mode === 'flow') {
      spawnSparks(e.clientX, e.clientY, 0.55, baseHue());
    }
  });
  document.getElementById('enterBtn').addEventListener('click', () => {
    if (mode === 'flow' || mode === 'fading') {
      surgeOn = true;
      mode = 'tracing'; traceStart = t; litAlpha = 0; heads = [];
      document.getElementById('enterBtn').classList.add('gone');
      setTimeout(() => { document.getElementById('hint').style.opacity = '0.45'; }, 4200);
    }
  });

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#01030c'; ctx.fillRect(0, 0, W, H);
    buildText();
    buildParts();
  }
  addEventListener('resize', resize);
  resize();

  const LINE_DELAY = 0.55, LINE_DUR = 1.7;
  function lineProgress(i) {
    if (mode === 'lit') return 1;
    if (mode !== 'tracing') return 0;
    return Math.max(0, Math.min(1, (t - traceStart - i * LINE_DELAY) / LINE_DUR));
  }

  function frame() {
    t += 0.016;
    if (surgeOn) { surge = Math.min(1, surge + 0.03); if (surge >= 1) surgeOn = false; }
    else surge = Math.max(0, surge - 0.005);
    const timeScale = 1 + surge * 2.1;
    const hue = baseHue() + surge * 34;
    if (mode === 'tracing' && lineProgress(lines.length - 1) >= 1) { mode = 'lit'; nextSweep = t + 2.5; }
    if (mode === 'lit') litAlpha = Math.min(1, litAlpha + 0.02);
    if (mode === 'fading') { litAlpha = Math.max(0, 1 - (t - fadeStart) / 1.4); if (litAlpha <= 0) mode = 'flow'; }
    const wordPresence = mode === 'tracing' ? 1 : litAlpha;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(1,3,12,0.078)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'screen';
    const glowDim = 1 - wordPresence * 0.5;
    const glows = [
      [0.24 + 0.05 * Math.sin(t * 0.05), 0.26 + 0.04 * Math.cos(t * 0.04), 0.55, hue - 30, 0.05],
      [0.78 + 0.05 * Math.cos(t * 0.04 + 2), 0.7 + 0.05 * Math.sin(t * 0.045), 0.5, hue + 26, 0.045],
      [0.55 + 0.06 * Math.sin(t * 0.03 + 4), 0.9, 0.44, hue + 55, 0.035]
    ];
    for (const [fx, fy, fr, hh, al] of glows) {
      const gx = fx * W, gy = fy * H, gr = fr * Math.max(W, H);
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, `hsla(${hh}, 85%, 55%, ${al * glowDim})`); g.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = g; ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }
    if (wordPresence > 0.05) {
      const hx = W / 2, hy = H * 0.44, hr = Math.min(W, H) * 0.88;
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
      g.addColorStop(0, `hsla(${hue + 16}, 90%, 62%, ${0.07 * wordPresence})`); g.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = g; ctx.fillRect(hx - hr, hy - hr, hr * 2, hr * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // river particles, dimmed while the words are lit
    ctx.lineCap = 'round';
    const riverAlpha = 1 - wordPresence * 0.55;
    for (const p of parts) {
      p.px = p.x; p.py = p.y;
      const a = fieldAngle(p.x, p.y);
      let vx = Math.cos(a) * p.speed * timeScale, vy = Math.sin(a) * p.speed * timeScale;
      const dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx * dx + dy * dy;
      if (d2 < 19600 && d2 > 1) {
        const d = Math.sqrt(d2), f = 1 - d / 140;
        vx += ptr.vx * f * 0.55 + (-dy / d) * f * 0.7;
        vy += ptr.vy * f * 0.55 + (dx / d) * f * 0.7;
      }
      p.x += vx; p.y += vy;
      p.life++;
      const fade = Math.min(1, Math.min(p.life / 30, (p.maxLife - p.life) / 30));
      const spd = Math.min(1, Math.hypot(vx, vy) / 2.6);
      ctx.strokeStyle = `hsla(${hue + p.hueJit + spd * 26 + p.y / H * 18}, 92%, ${58 + spd * 20}%, ${0.5 * fade * riverAlpha})`;
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      if (p.life > p.maxLife || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) spawn(p);
    }

    // the words, revealed line by line behind the meteors
    if (textLayer && mode !== 'flow') {
      for (let i = 0; i < lines.length; i++) {
        const L = lines[i];
        const p = mode === 'tracing' ? lineProgress(i) : 1;
        if (p <= 0) continue;
        const frontier = -20 + p * (W + 40);
        ctx.save();
        ctx.globalAlpha = mode === 'tracing' ? Math.min(1, p * 1.6) : litAlpha * (0.92 + 0.08 * Math.sin(t * 1.4));
        ctx.beginPath(); ctx.rect(0, L.top - 6, frontier, (L.bottom - L.top) + 12); ctx.clip();
        ctx.drawImage(textLayer, 0, 0, W, H);
        ctx.restore();
        // its tracing meteor
        if (mode === 'tracing' && p > 0 && p < 1 && L.pts.length) {
          const idx = Math.min(L.pts.length - 1, Math.floor(p * L.pts.length));
          const pt = L.pts[idx];
          drawMeteor(pt.x, pt.y, hue, frontier);
        }
      }
      // twinkles on the ink once lit
      if (mode === 'lit') {
        for (let k = 0; k < 3; k++) {
          const L = lines[(Math.random() * lines.length) | 0];
          if (!L || !L.pts.length) continue;
          const pt = L.pts[(Math.random() * L.pts.length) | 0];
          ctx.beginPath(); ctx.arc(pt.x, pt.y, 1.3 + Math.random() * 1.4, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue + 20}, 100%, 88%, ${0.35 + Math.random() * 0.5})`;
          ctx.fill();
        }
        // a meteor re-traces a line now and then
        if (t > nextSweep) { addHead((Math.random() * lines.length) | 0, 0.55 + Math.random() * 0.4); nextSweep = t + 3.2 + Math.random() * 3.4; }
      }
    }
    // sweep heads (re-tracing passes over already-lit words)
    for (const h of heads) {
      const L = lines[h.line];
      h.p += 0.016 * h.speed / LINE_DUR * 1.4;
      const idx = Math.min(L.pts.length - 1, Math.floor(h.p * L.pts.length));
      const pt = L.pts[Math.max(0, idx)];
      h.x += (pt.x - h.x) * 0.5; h.y += (pt.y - h.y) * 0.5;
      h.trail.unshift({ x: h.x, y: h.y });
      if (h.trail.length > 16) h.trail.pop();
      for (let j = h.trail.length - 1; j > 0; j--) {
        const a = (1 - j / h.trail.length) * 0.5;
        ctx.strokeStyle = `hsla(${hue + 24}, 96%, 78%, ${a})`;
        ctx.lineWidth = 2.4 * (1 - j / h.trail.length) + 0.4;
        ctx.beginPath(); ctx.moveTo(h.trail[j].x, h.trail[j].y); ctx.lineTo(h.trail[j - 1].x, h.trail[j - 1].y); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(h.x, h.y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(245,252,255,.95)';
      ctx.shadowColor = `hsla(${hue + 20}, 95%, 70%, 1)`; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0;
    }
    heads = heads.filter(h => h.p < 1.05);

    // tap sparks
    for (const s of sparks) {
      const sx = s.x, sy = s.y;
      s.x += s.vx; s.y += s.vy; s.vx *= 0.97; s.vy *= 0.97; s.life -= s.decay;
      if (s.life <= 0) continue;
      ctx.strokeStyle = `hsla(${s.hue}, 95%, 76%, ${s.life * 0.85})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    sparks = sparks.filter(s => s.life > 0);

    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.05;
    const gx2 = (Math.random() * 140) | 0, gy2 = (Math.random() * 140) | 0;
    for (let x = -gx2; x < W; x += 140) for (let y = -gy2; y < H; y += 140) ctx.drawImage(grain, x, y);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (!reduce) requestAnimationFrame(frame);
  }
  function drawMeteor(x, y, hue, frontier) {
    const len = 64;
    const g = ctx.createLinearGradient(x - len, y, x, y);
    g.addColorStop(0, 'hsla(0,0%,100%,0)');
    g.addColorStop(1, `hsla(${hue + 24}, 96%, 82%, .75)`);
    ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(Math.max(0, x - len), y); ctx.lineTo(x, y); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(245,252,255,.97)';
    ctx.shadowColor = `hsla(${hue + 20}, 95%, 70%, 1)`; ctx.shadowBlur = 16; ctx.fill(); ctx.shadowBlur = 0;
  }
  frame();
</script>
</body>
</html>

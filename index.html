<!DOCTYPE html>

<style>

  html, body { height: 100%; }
  body {
    background: #0a0c10;

    font-family: "Avenir Next", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:

    font-size: clamp(56px, 13vw, 128px);
    font-weight: 650;
    letter-spacing: 0.015em;
    line-height: 1;
    background: linear-gradient(100deg, #eef1f5 20%, #f5b544 55%, #d8b26a 75%, #cdd6df 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .rule {
    width: 64px;
    height: 1px;
    margin: 30px auto 22px;
    background: linear-gradient(90deg, transparent, #d8b26a, transparent);

  .domain {
    font-size: 13px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #9aa7b5;
    text-indent: 0.42em;
  }

    margin-top: 16px;
    font-size: 13px;
    letter-spacing: 0.14em;

<body>
